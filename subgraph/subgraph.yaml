specVersion: 1.0.0
description: Argus4626 ERC-4626 vault health snapshots and inflation alerts
repository: https://github.com/alva-p/Argus4626

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: SteakhouseUSDC
    network: mainnet
    source:
      address: '0xBEEF01735c132Ada46AA9aA4c54623cAA92A64CB'
      abi: ArgusVault
      startBlock: 18941135
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultSnapshot
        - SecurityAlert
      abis:
        - name: ArgusVault
          file: ../abi/erc4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      blockHandlers:
        - handler: handleOnce
          filter:
            kind: once
      file: ./src/mapping.ts

  - kind: ethereum/contract
    name: FlagshipETH
    network: mainnet
    source:
      address: '0x38989bBA00BDF8181F4082995b3DEAe96163aC5D'
      abi: ArgusVault
      startBlock: 18941135
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultSnapshot
        - SecurityAlert
      abis:
        - name: ArgusVault
          file: ../abi/erc4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts

  - kind: ethereum/contract
    name: YearnUSDC
    network: mainnet
    source:
      address: '0xBe53A109B494E5c9f97b9Cd39Fe969BE68BF6204'
      abi: ArgusVault
      startBlock: 18941135
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultSnapshot
        - SecurityAlert
      abis:
        - name: ArgusVault
          file: ../abi/erc4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
